# DHCP runs on every Ethernet port, and netplan's 10-netplan.conf would wait
# for a cable in each of them, so an unused port would delay the network, and
# Docker and Gladys with it, by two minutes at every boot. Drop-ins apply in
# file name order whatever their directory, so this one replaces netplan's
# commands: the network is online as soon as any port is routable with DNS.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --dns -o routable
