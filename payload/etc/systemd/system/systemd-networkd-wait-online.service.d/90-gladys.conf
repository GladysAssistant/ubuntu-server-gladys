# DHCP runs on every Ethernet port. netplan's 10-netplan.conf would wait for a
# cable in each of them, so an unused port would delay the network, and Docker
# and Gladys with it, by two minutes at every boot. It also skips this service
# when no interface matches "wired" or "wired-eth" at the moment netplan runs,
# early at boot.
# Drop-ins apply in file name order whatever their directory, so this one
# replaces netplan's settings: the service always runs, with the condition of
# its own unit, after systemd-resolved as netplan orders it for --dns, and the
# network is online as soon as any port is routable with DNS.
[Unit]
ConditionPathIsSymbolicLink=
ConditionCapability=CAP_NET_ADMIN
After=systemd-resolved.service

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --dns -o routable
