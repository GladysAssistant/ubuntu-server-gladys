autoinstall:
  version: 1
  interactive-sections: []
  # CI-only throwaway account standing in for the one an operator creates on
  # the identity screen. CI media are never published; production rejects it.
  identity:
    hostname: gladys-ci
    username: gladys-ci
    password: "$6$gladysci$XGVxe661m5jd9kCAtb1W.PeSdgOtp7Iz8.0JsgCPRKdB8juiJAPTZ2y5pTyM6EyfthhAQj1cvSrZ3021QYq.S/"
  locale: en_US.UTF-8
  timezone: Etc/UTC
  source:
    id: ubuntu-server-minimal
  storage:
    layout:
      name: direct
  ssh:
    install-server: true
  kernel-crash-dumps:
    enabled: false
  drivers:
    install: false
  apt:
    fallback: offline-install
  updates: security
  user-data:
    hostname: gladys
    preserve_hostname: false
    manage_etc_hosts: true
    disable_root: true
    users: []
  late-commands:
    - [sh, -c, "cd /cdrom/gladys && sha256sum -c gladys-payload.tar.sha256"]
    - [sh, -c, "tar --extract --file=/cdrom/gladys/gladys-payload.tar --directory=/target --numeric-owner --same-permissions"]
    - [sh, -c, "chown -R 0:0 /target/usr/lib/gladys-installer /target/usr/share/gladys-installer /target/opt/gladys /target/etc/gladys-installer /target/var/lib/gladys-installer"]
    - [sh, -c, "chmod 0755 /target/usr/lib/gladys-installer/*.py /target/usr/local/sbin/gladys-diagnostics"]
    - [sh, -c, "chmod 0644 /target/etc/systemd/system/gladys-*.service /target/opt/gladys/compose.yaml"]
    # Ubuntu Server keeps the C.UTF-8 system locale, so record the language
    # chosen in the installer for the setup page and the tty1 console.
    - [sh, -c, "sed -n 's/^  locale: //p' /var/log/installer/autoinstall-user-data | head -n 1 > /target/etc/gladys-installer/language; chmod 0644 /target/etc/gladys-installer/language"]
    - systemctl --root=/target enable gladys-setup-web.service
    - systemctl --root=/target enable gladys-firstboot.service
    - systemctl --root=/target enable gladys-console.service
    - systemctl --root=/target mask getty@tty1.service
  shutdown: reboot
