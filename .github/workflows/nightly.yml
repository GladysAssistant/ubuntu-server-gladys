name: Weekly ecosystem integration

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl git grub-common libguestfs-tools ovmf python3-venv qemu-system-x86 qemu-utils squashfs-tools xorriso yamllint
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --requirement requirements-build.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Authenticate Ubuntu metadata
        id: ubuntu
        run: |
          bash scripts/fetch-ubuntu-base.sh --metadata-only
          echo "sha256=$(python3 -c 'import json; print(json.load(open("build/ubuntu-source.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: ubuntu-26.04-amd64-${{ steps.ubuntu.outputs.sha256 }}
      - name: Build current production, real, and smoke media
        run: |
          validator="$(bash scripts/fetch-subiquity-validator.sh)"
          make -C "$validator" install_deps
          bash scripts/build-iso.sh --profile production
          bash scripts/build-iso.sh --profile ci-real
          bash scripts/build-iso.sh --profile ci-smoke
      - name: Real Gladys v5 and Watchtower integration
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          bash tests/integration/qemu-install.sh --iso "dist/gladys-assistant-installer-ci-real-v${version}-amd64.iso" --work-dir build/qemu-real
          bash tests/integration/qemu-firstboot.sh --disk build/qemu-real/system.qcow2 --vars build/qemu-real/OVMF_VARS.fd --work-dir build/qemu-real-boot --profile ci-real
      - name: Offline-to-online recovery on one disk
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          bash tests/integration/qemu-install.sh --iso "dist/gladys-assistant-installer-ci-smoke-v${version}-amd64.iso" --work-dir build/qemu-network
          bash tests/integration/qemu-network-recovery.sh --disk build/qemu-network/system.qcow2 --vars build/qemu-network/OVMF_VARS.fd --work-dir build/qemu-network-recovery
      - name: Deterministic forced-power-loss recovery
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          bash tests/integration/qemu-install.sh --iso "dist/gladys-assistant-installer-ci-smoke-v${version}-amd64.iso" --work-dir build/qemu-power
          bash tests/integration/qemu-power-loss.sh --disk build/qemu-power/system.qcow2 --vars build/qemu-power/OVMF_VARS.fd --work-dir build/qemu-power-recovery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: weekly-serial-logs
          path: build/**/*serial.log
          if-no-files-found: ignore
          retention-days: 14
