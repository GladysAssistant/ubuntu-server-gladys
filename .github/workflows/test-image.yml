name: Test image

on:
  push:
    tags: ['v*.*.*-*']

permissions:
  contents: read

# The test image is one fixed R2 object: let uploads finish in tag order.
concurrency:
  group: test-image
  cancel-in-progress: false

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate test tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "v$version-"* ]]
      - name: Run static and unit gates
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt yamllint python3-venv
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --requirement requirements-build.txt
          find scripts tests/integration -type f -name '*.sh' -print0 | xargs -0 shellcheck
          shfmt -d scripts/*.sh tests/integration/*.sh
          .venv/bin/python -m compileall -q payload/usr/lib/gladys-installer scripts tests
          .venv/bin/python -m unittest discover -s tests/unit -v
          yamllint -c .yamllint.yml autoinstall payload/opt/gladys/compose.yaml .github
          docker compose -f payload/opt/gladys/compose.yaml config --quiet

  build-and-inspect:
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes git grub-common python3-venv squashfs-tools xorriso yamllint
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --requirement requirements-build.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Authenticate Ubuntu metadata
        id: ubuntu
        run: |
          bash scripts/fetch-ubuntu-base.sh --metadata-only
          echo "sha256=$(python3 -c 'import json; print(json.load(open("build/ubuntu-source.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: ubuntu-26.04-amd64-${{ steps.ubuntu.outputs.sha256 }}
      - name: Build and inspect production and real Gladys media
        run: |
          validator="$(bash scripts/fetch-subiquity-validator.sh)"
          make -C "$validator" install_deps
          bash scripts/build-iso.sh --profile production
          bash scripts/build-iso.sh --profile ci-real
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-media
          path: dist
          retention-days: 3

  real-gladys:
    needs: build-and-inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: test-media, path: dist}
      - name: Install QEMU tools and run real Gladys gate
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl libguestfs-tools ovmf qemu-system-x86 qemu-utils
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          version="$(tr -d '\r\n' < VERSION)"
          bash tests/integration/qemu-install.sh --iso "dist/gladys-assistant-installer-ci-real-v${version}-amd64.iso" --work-dir build/real
          bash tests/integration/qemu-firstboot.sh --disk build/real/system.qcow2 --vars build/real/OVMF_VARS.fd --work-dir build/real-boot --profile ci-real
      - name: Upload real Gladys diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-real-gladys-diagnostics
          path: |
            build/**/*serial.log
            build/**/last-*.json
            build/**/last-*.txt
            build/**/libguestfs-preflight.log
          if-no-files-found: warn
          retention-days: 7

  publish-test:
    needs: [quality-gates, build-and-inspect, real-gladys]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: test-media, path: dist}
      - name: Upload the ISO to the test R2 path
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          bash scripts/publish-r2.sh --iso "dist/gladys-assistant-installer-v${version}-amd64.iso" --channel test
